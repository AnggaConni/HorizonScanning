name: Fetch NASA FIRMS Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-hazard-data:
    runs-on: ubuntu-latest
    
    # TAMBAHKAN 2 BARIS INI (Izin menulis ke repo):
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Jalankan Script Python
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python fetch_firms.py

      - name: Commit dan Push hazard.json ke Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hazard.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update hazard.json via NASA FIRMS" && git push)
