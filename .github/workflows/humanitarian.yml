name: Update Humanitarian ReliefWeb Feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-humanitarian-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install requests

      - name: Fetch ReliefWeb humanitarian reports
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python fetch_humanitarian.py

      - name: Commit updated feed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add humanitarian.json
          git diff --cached --quiet || (git commit -m "Update ReliefWeb humanitarian feed" && git push)
