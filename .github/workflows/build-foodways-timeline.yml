name: Build Foodways Historical Timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 1,4"

permissions:
  contents: write

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HorizonScanning
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional clients
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build heuristic timeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: python scripts/build_foodways_timeline.py

      - name: Commit timeline dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add foodways_timeline.json
          git diff --cached --quiet || (git commit -m "Update Foodways heuristic timeline" && git push)
