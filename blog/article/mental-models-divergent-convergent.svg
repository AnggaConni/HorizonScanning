<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Divergent First, Convergent Later</title>
<desc id="desc">An interactive-style learning map showing observation, divergence, investigation, convergence, and closure.</desc>
<rect width="1200" height="760" rx="36" fill="#0f172a"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#f8fafc">DIVERGE FIRST → CONVERGE LATER</text>
<text x="70" y="118" font-family="Inter,Arial,sans-serif" font-size="17" fill="#94a3b8">A mental model for learning, sense-making, and inclusive judgment</text>

<g transform="translate(70 165)">
<rect width="210" height="120" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
<text x="105" y="42" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fbbf24">01 · OBSERVE</text>
<text x="105" y="72" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">What happened?</text>
<text x="105" y="96" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cbd5e1">Separate fact from story.</text>
</g>

<path d="M280 225 H350" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M344 217 L358 225 L344 233" fill="#64748b"/>

<g transform="translate(360 145)">
<rect width="300" height="160" rx="25" fill="#052e2b" stroke="#34d399" stroke-width="3"/>
<text x="150" y="40" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#6ee7b7">02 · DIVERGE</text>
<text x="150" y="72" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">What else could explain it?</text>
<text x="150" y="103" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#a7f3d0">1 → 2 → 5 → many hypotheses</text>
<text x="150" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#6ee7b7">Do not close the explanation space too early.</text>
</g>

<path d="M510 305 C510 345 370 365 370 415" fill="none" stroke="#34d399" stroke-width="4"/>
<path d="M510 305 C510 345 650 365 650 415" fill="none" stroke="#34d399" stroke-width="4"/>

<g transform="translate(180 410)">
<rect width="380" height="150" rx="25" fill="#172554" stroke="#38bdf8" stroke-width="3"/>
<text x="190" y="40" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#7dd3fc">03 · INVESTIGATE</text>
<text x="190" y="74" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">Ask what would distinguish them.</text>
<text x="190" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#bae6fd">Ask · observe · read · compare · test</text>
<text x="190" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#7dd3fc">Missing variables often live here.</text>
</g>

<g transform="translate(640 410)">
<rect width="380" height="150" rx="25" fill="#451a03" stroke="#f59e0b" stroke-width="3"/>
<text x="190" y="40" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fbbf24">04 · CONVERGE</text>
<text x="190" y="74" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">Which explanation fits the evidence?</text>
<text x="190" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#fde68a">Eliminate · weigh · update · decide</text>
<text x="190" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fcd34d">Convergence is the closing move.</text>
</g>

<path d="M560 485 H640" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M634 477 L648 485 L634 493" fill="#64748b"/>

<g transform="translate(410 610)">
<rect width="380" height="92" rx="22" fill="#f8fafc"/>
<text x="190" y="34" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="900" fill="#0f172a">05 · CLOSE — FOR NOW</text>
<text x="190" y="61" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">“This is my working model, given current evidence.”</text>
<text x="190" y="81" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748b">New evidence can reopen the model.</text>
</g>

<path d="M830 560 C970 585 1010 570 1080 500 C1130 450 1120 320 1015 250" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="10 9"/>
<text x="1040" y="300" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#c4b5fd">NEW EVIDENCE?</text>
<text x="1040" y="323" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">REOPEN → DIVERGE AGAIN</text>

<g transform="translate(70 650)">
<rect width="260" height="56" rx="16" fill="#052e2b" stroke="#34d399"/>
<text x="130" y="35" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#a7f3d0">HUSNUZAN → don't assume worst</text>
</g>
<g transform="translate(840 650)">
<rect width="290" height="56" rx="16" fill="#172554" stroke="#38bdf8"/>
<text x="145" y="35" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#bae6fd">TEPA SELIRA → consider the other context</text>
</g>
</svg>